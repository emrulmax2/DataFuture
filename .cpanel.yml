# .cpanel.yml
# Custom deployment script for Laravel + Vite
deployment:
  tasks:
    - pre_deploy:
        # Ensure the right PHP version is set
        - echo "Setting PHP version to 8.2..."
        - /usr/local/bin/ea-php82 /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader

        # Install Node.js dependencies for Vite
        - echo "Installing Node.js dependencies..."
        - /opt/cpanel/ea-nodejs22/bin/npm ci --legacy-peer-deps

    - deploy:
        # Build the Vite assets
        - echo "Building Vite assets..."
        - /opt/cpanel/ea-nodejs22/bin/npm run build

        # Run Laravel migrations (optional, only if needed)
        - echo "Running Laravel migrations..."
        - /usr/local/bin/ea-php82 artisan migrate --force

    - post_deploy:
        # Clear Laravel caches
        - echo "Clearing application cache..."
        - /usr/local/bin/ea-php82 artisan config:cache
        - /usr/local/bin/ea-php82 artisan route:cache
        - /usr/local/bin/ea-php82 artisan view:cache
        - /usr/local/bin/ea-php82 artisan optimize
        - /usr/local/bin/ea-php82 artisan queue:restart